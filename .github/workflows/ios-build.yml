name: Build VoiceKey iOS IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install Rust iOS targets
        run: |
          set -e
          if ! command -v cargo >/dev/null 2>&1; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: ios/VoiceKeyCore/rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'ios/VoiceKeyCore/rust/Cargo.lock') }}

      - name: Cache librime/boost sources
        uses: actions/cache@v4
        with:
          path: ios/Pinyin/.cache
          key: pinyin-cache-${{ hashFiles('ios/Pinyin/versions.env') }}

      - name: Select Xcode 26 (iOS 26 SDK required by topEdgeEffect etc.)
        run: |
          ls -d /Applications/Xcode* 2>/dev/null || true
          X26=$(ls -d /Applications/Xcode_26* /Applications/Xcode-26* 2>/dev/null | sort -V | tail -1)
          if [ -n "$X26" ]; then sudo xcode-select -s "$X26/Contents/Developer"; fi
          xcodebuild -version

      - name: Build unsigned IPA
        run: |
          set -x
          ios/build.sh --unsigned

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoiceKey-unsigned
          path: ios/build/VoiceKey-unsigned.ipa
          retention-days: 14
