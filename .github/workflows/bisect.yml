name: Bisect
on:
  workflow_dispatch:
jobs:
  t1-checkout:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: echo "checkout ok"
  t2-cache:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /tmp/nope
          key: bisect-${{ github.run_id }}
      - run: echo "cache ok"
  t3-upload:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: echo hi > /tmp/artifact.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bisect-t3
          path: /tmp/artifact.txt
      - run: echo "upload ok"
